<!doctype html>
<!-- Open at http://localhost:8000/test/write-check.html. Plays 100 rounds of
     every writing lesson, entering the app's own model answer (all must be
     correct), then grades answers the book accepts (must pass) and common
     mistakes (must fail). -->
<meta charset="utf-8"><title>Writing check</title>
<iframe id="f" src="../index.html" style="width:900px;height:600px"></iframe><pre id="out">running…</pre>
<script>
var f = document.getElementById('f'), out = [];
f.onload = function () {
  var w = f.contentWindow, d = f.contentDocument;
  w.onerror = function (m, s, l) { out.push('ERROR ' + m + ' @' + l); };
  d.getElementById('start').hidden = true;
  w.Sound.playNote = w.Sound.playAt = function () {};
  w.Sound.playSequence = function () { return Promise.resolve(); };
  var T = w.Theory, H = w.Harmony, C = w.Exercises.compose, P = T.parse, k = T.key('C');
  var lessons = [];
  w.Curriculum.UNITS.forEach(function (u) { u.lessons.forEach(function (l) { if (/^write/.test(l.engine) && l.engine !== 'writeKeySig') lessons.push(l); }); });
  lessons.forEach(function (L) {
    var E = w.Exercises.engines[L.engine], bad = 0;
    for (var i = 0; i < 100; i++) {
      E.round(L);
      var cur = E.current;
      cur.model.forEach(function (col, c) { col.forEach(function (n, vi) {
        if (n && !(cur.notes[c][vi] && T.same(n, cur.notes[c][vi]))) cur.place(c, vi, T.note(n.l, n.acc, n.oct));
      }); });
      cur.check();
      var fb = d.getElementById('feedback');
      if (!/good/.test(fb.className)) { bad++; if (bad < 4) out.push(L.id + ' model failed: ' + fb.textContent); }
    }
    out.push((bad ? 'FAIL ' : 'ok   ') + L.id + ': ' + bad + '/100 model answers marked wrong');
  });
  // beams and barlines: the right answer must pass
  w.Curriculum.UNITS.forEach(function (u) { u.lessons.forEach(function (L) {
    if (L.engine !== 'beamRhythm') return;
    var bad = 0;
    for (var i = 0; i < 50; i++) {
      w.Exercises.engines.beamRhythm.round(L);
      var cur = w.Exercises.engines.beamRhythm.current;
      cur.want.forEach(function (on, j) { if (on) cur.toggle(j); });
      if (L.mode === 'both') { cur.setTool('bar'); cur.wantBars.forEach(function (on, j) { if (on) cur.toggle(j); }); }
      cur.check();
      if (!/good/.test(d.getElementById('feedback').className)) { bad++; if (bad < 3) out.push(L.id + ' failed: ' + d.getElementById('feedback').textContent); }
    }
    out.push((bad ? 'FAIL ' : 'ok   ') + L.id + ': ' + bad + '/50 right answers marked wrong');
  }); });

  // key signatures, invented progressions, and the multiple-choice drills
  var each = function (engine, fn) { w.Curriculum.UNITS.forEach(function (u) { u.lessons.forEach(function (L) { if (L.engine === engine) fn(L); }); }); };
  var good = function () { return /good/.test(d.getElementById('feedback').className); };
  each('writeKeySig', function (L) {
    var bad = 0;
    for (var i = 0; i < 40; i++) {
      w.Exercises.engines.writeKeySig.round(L);
      var cur = w.Exercises.engines.writeKeySig.current;
      cur.want.forEach(function (p) { cur.place(p, cur.sharp ? 1 : -1); });
      cur.check();
      if (!good()) bad++;
    }
    w.Exercises.engines.writeKeySig.round(L);
    var c2 = w.Exercises.engines.writeKeySig.current;
    c2.want.slice(1).forEach(function (p) { c2.place(p, c2.sharp ? 1 : -1); });
    c2.check();
    out.push((bad || good() ? 'FAIL ' : 'ok   ') + L.id + ': ' + bad + '/40 right signatures marked wrong; a missing accidental ' + (good() ? 'PASSED' : 'fails'));
  });
  each('inventProgression', function (L) {
    w.Exercises.engines.inventProgression.round(L);
    var cur = w.Exercises.engines.inventProgression.current;
    ['vi', 'IV', 'ii', 'V', 'vi', 'ii', 'V', 'I'].forEach(cur.choose);
    cur.check();
    var g1 = good();
    w.Exercises.engines.inventProgression.round(L);
    cur = w.Exercises.engines.inventProgression.current;
    ['V', 'IV', 'I', 'V', 'IV', 'I', 'V', 'I'].forEach(cur.choose);
    cur.check();
    out.push((g1 && !good() ? 'ok   ' : 'FAIL ') + L.id + ': a progressive progression passes, a retrogressive one fails');
  });
  ['meterType', 'motionType'].forEach(function (eng) {
    each(eng, function (L) {
      var bad = 0;
      for (var i = 0; i < 60; i++) {
        w.Exercises.engines[eng].round(L);
        var bs = [].slice.call(d.querySelectorAll('#answers .ans-btn'));
        bs[0].click();
        if (!d.querySelector('#answers .ans-btn.right')) bad++;
      }
      out.push((bad ? 'FAIL ' : 'ok   ') + L.id + ': ' + bad + '/60 rounds without a right answer');
    });
  });

  // non-chord tones, by hand: C major I - V, model voicing
  var c1 = H.chord(k, 'I'), c2 = H.chord(k, 'V');
  var m = [['C3', 'G3', 'E4', 'C5'], ['G2', 'G3', 'D4', 'B4']].map(function (x) { return x.map(P); });
  function nct(want, mid, beat, after) {
    var g = [m[0].slice(), [null, null, null, null], m[1].slice(), [null, null, null, null]];
    (mid || []).forEach(function (x) { g[1][x[0]] = P(x[1]); });
    (beat || []).forEach(function (x) { g[2][x[0]] = P(x[1]); });
    (after || []).forEach(function (x) { g[3][x[0]] = P(x[1]); });
    return C.gradeNCT(k, c1, c2, m, want, g).problems.map(function (p) { return p.msg; });
  }
  expect('anticipation: soprano C5, then B4 early, then B4', true, nct({ type: 'ANT' }, [[3, 'B4']]));
  expect('alto E4, then D4 early: an anticipation, not the passing tone asked for', false, nct({ type: 'PT' }, [[2, 'D4']]));
  expect('a chord tone is not a non-chord tone (alto E4–G4–D4: G is in I)', false, nct({ type: 'PT' }, [[2, 'G4']]));
  expect('wrong type: an anticipation when a passing tone is asked', false, nct({ type: 'PT' }, [[3, 'B4']]));
  expect('two voices decorated', false, nct({ type: 'ANT' }, [[3, 'B4'], [2, 'D4']]));
  expect('4–3 suspension: soprano C5 held over V, resolving to B4', true, nct({ type: 'SUS', figure: '4-3' }, null, [[3, 'C5']], [[3, 'B4']]));
  expect('suspension without its resolution', false, nct({ type: 'SUS', figure: '4-3' }, null, [[3, 'C5']]));
  expect('suspension named wrong (asked 7–6)', false, nct({ type: 'SUS', figure: '7-6' }, null, [[3, 'C5']], [[3, 'B4']]));
  expect('appoggiatura that resolves away from V’s third (B) loses the third', false, nct({ type: 'APP' }, null, [[3, 'E5']], [[3, 'D5']]));

  function grade(ids, vs, opts) {
    var ch = ids.map(function (id) { return id.tones ? id : H.chord(k, id); });
    return C.gradeFour(k, ch, vs.map(function (x) { return x.map(P); }), opts).problems.map(function (p) { return p.msg; });
  }
  function expect(name, ok, problems) { out.push((ok === !problems.length ? 'ok   ' : 'FAIL ') + name + (problems.length ? ': ' + problems.join(' | ') : '')); }
  expect('incomplete V7 to complete I', true, grade(['V7', 'I'], [['G2', 'F3', 'B3', 'G4'], ['C3', 'E3', 'C4', 'G4']]));
  expect('complete V7 to I with a tripled root', true, grade(['V7', 'I'], [['G2', 'F3', 'B3', 'D4'], ['C3', 'E3', 'C4', 'C4']]));
  expect('frustrated leading tone in the alto', true, grade(['V', 'I'], [['G2', 'D3', 'B3', 'G4'], ['C3', 'E3', 'G3', 'G4']]));
  expect('I6–vi doubling vi’s third (a guideline note only)', true, grade(['I6', 'vi'], [['E3', 'G3', 'C4', 'C5'], ['A2', 'E3', 'C4', 'C5']]));
  expect('parallel 5ths', false, grade(['IV', 'V'], [['F2', 'C3', 'A3', 'F4'], ['G2', 'D3', 'B3', 'G4']]));
  expect('enharmonic misspelling', false, grade(['V'], [['G2', 'D3', 'Cb4', 'G4']]));
  expect('wrong bass for the figure', false, grade(['V6'], [['G2', 'D3', 'B3', 'G4']]));
  expect('doubled leading tone', false, grade(['V'], [['G2', 'B3', 'D4', 'B4']]));
  expect('wrong note', false, grade(['I'], [['C3', 'G3', 'E4', 'D5']]));
  var dim7 = C.looseChord(P('B3'), 'dim7', 0);
  expect('diminished 7th without its fifth', false, grade([dim7], [['B2', 'B3', 'D4', 'Ab4']], { keyless: true }));
  var a = T.key('A', 'minor');
  expect('figures: V in a minor is ♯', true, C.figureText(a, H.chord(a, 'V')) === '♯' ? [] : ['got ' + C.figureText(a, H.chord(a, 'V'))]);
  expect('figures: vii°6 in a minor is ♯6', true, C.figureText(a, H.chord(a, 'vii°6')) === '♯6' ? [] : ['got ' + C.figureText(a, H.chord(a, 'vii°6'))]);
  document.getElementById('out').textContent = out.join('\n');
};
</script>
